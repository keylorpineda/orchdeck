name: Feature Request
description: Propose an improvement aligned with Orchdeck's workbench model (without turning it into an IDE).
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the daily workflow friction this solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Behavior
      description: How should it work while keeping UI calm and human Git control intact?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary Area
      options:
        - UI / Change Cards
        - Model Fusion / Recipes
        - Approval Modes / Security
        - Plugins / Skills / MCP
        - Usage & Quota Radar
        - Git Worktrees / Project Memory
    validations:
      required: true
