name: External CLI / Adapter Breakage
description: Report when an upstream Claude Code, Codex, or Antigravity CLI release breaks an adapter.
title: "[Adapter Breakage]: "
labels: ["bug"]
body:
  - type: dropdown
    id: provider
    attributes:
      label: Affected CLI
      options:
        - Claude Code (claude)
        - Codex CLI (codex)
        - Antigravity CLI (agy)
    validations:
      required: true
  - type: input
    id: cli_version
    attributes:
      label: Installed CLI Version
      description: Run `<cli> --version` and paste the output.
      placeholder: "e.g. 1.0.45"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11 / macOS"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Observed Error or Format Change (redact tokens or sensitive paths)
      render: shell
    validations:
      required: true
