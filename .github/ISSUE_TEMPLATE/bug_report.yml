name: Reporte de Bug
description: Reporta un error en la app, el Core Daemon, Git o la interfaz.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Qué ocurrió y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir proyecto...
        2. Seleccionar modo/motor...
        3. Observar error...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema Operativo y versión
      placeholder: "Windows 11 / macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o captura relevante (sin secretos ni tokens)
      render: shell
