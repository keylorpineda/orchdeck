name: Bug Report
description: Report a bug in the desktop app, Core Daemon, Git integration, or UI.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open project...
        2. Select engine/mode...
        3. Observe error...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System & Version
      placeholder: "Windows 11 / macOS 15"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Output (redact tokens/secrets)
      render: shell
