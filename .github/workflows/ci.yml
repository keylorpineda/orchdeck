name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies with pnpm
        run: pnpm install --frozen-lockfile

      - name: Run repository and workspace lint
        run: pnpm run lint

      - name: Run workspace build
        run: pnpm run build

      - name: Run workspace typecheck
        run: pnpm run typecheck

      - name: Run workspace tests
        run: pnpm run test
